# Official Google sources of Gemini and Antigravity skills, extensions, MCP servers, SDKs and docs.
# Apache-2.0 or BSD-3-Clause only (checked live: the license file travels with every source).
# google-antigravity/antigravity-cli has no license file, so it is listed in INDEX.md as a pointer and never copied.
# take = regexes a path must match, skip = regexes that remove a path, max_kb = largest file kept (default 200).

[[source]]
repo = "google-gemini/gemini-cli"
kind = "cli"
take = ["^docs/", "SKILL\\.md$", "^README\\.md$", "gemini-extension\\.json$", "^(packages/[^/]+/)?src/.*/skills/"]

